name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out all history and refs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install pinned Gitleaks 8.30.1
        shell: bash
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          binary="${RUNNER_TEMP}/gitleaks"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
          chmod 0755 "${binary}"
          "${binary}" version
      - name: Run the allowlisted full-history/all-ref scan
        shell: bash
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          MIKROKHOROS_REQUIRE_GITLEAKS: "1"
        run: |
          set -euo pipefail
          "${GITLEAKS_BIN}" git \
            --config "${GITHUB_WORKSPACE}/.gitleaks.toml" \
            --no-banner \
            --redact \
            --log-level error \
            '--log-opts=--all --full-history --reflog'
          export PATH="${RUNNER_TEMP}:${PATH}"
          make test-secrets

  format:
    name: Swift format
    runs-on: ubuntu-24.04
    # `make preflight` also builds the release CLI to verify generated command
    # reference output. A cold SwiftNIO build can legitimately outlast ten
    # minutes on an Ubuntu runner, so give this complete validation lane the
    # same budget as the platform test lanes.
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Swift 6.1
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.1.0"
      - name: Verify formatting and license headers
        run: make preflight
      - name: Verify immutable launch-source binding
        run: make check-public-release
      - name: Check shell scripts
        run: shellcheck scripts/*.sh

  test:
    name: Swift 6.1 / ${{ matrix.os }}
    env:
      MIKROKHOROS_WARNINGS_AS_ERRORS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    # Windows performs separate cold debug-test and optimized-release builds;
    # keep every validation step while allowing hosted-runner variance. The
    # faster macOS and Linux lanes retain their tighter ceiling.
    timeout-minutes: ${{ matrix.os == 'windows-2022' && 45 || 20 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Swift 6.1
        if: runner.os != 'Windows'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.1.0"
      - name: Set up Swift 6.1 on Windows
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          source: swift.org
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
          build_arch: amd64
          # Apply Swift's compatibility maps for the Windows SDK on this runner.
          update-sdk-modules: true
      - name: Select the macOS 15.2 SDK
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
          xcrun --sdk macosx --show-sdk-version
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build release
        run: swift build -c release
      - name: Exercise interactive terminal
        if: runner.os != 'Windows'
        shell: bash
        run: make test-terminal SWIFT_BUILD_FLAGS="-c release"
      - name: Smoke-test CLI product
        run: swift run -c release khoros --help
