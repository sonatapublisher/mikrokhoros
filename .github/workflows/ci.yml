name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Swift format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Swift 6.0
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.0"
      - name: Verify formatting
        run: swift format lint --strict --recursive --parallel Sources Tests Package.swift

  test:
    name: Swift 6.0 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Swift 6.0
        if: runner.os != 'Windows'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.0"
      - name: Set up Swift 6.0 on Windows
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          source: swift.org
          swift-version: swift-6.0.3-release
          swift-build: 6.0.3-RELEASE
          build_arch: amd64
          # Apply Swift's compatibility maps for the Windows SDK on this runner.
          update-sdk-modules: true
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build release
        run: swift build -c release
      - name: Smoke-test CLI product
        run: swift run -c release khoros --help
