name: Bug report
description: Report a reproducible mikrokhoros defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include credentials, private prompts, or sensitive world data. Report vulnerabilities privately according to SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe sequence of commands or Swift code that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: mikrokhoros commit
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: input
    id: swift
    attributes:
      label: Swift version
      placeholder: Output of swift --version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
        - Other embedding host
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted output
      description: Include only output needed to diagnose the problem. Remove secrets and private message content.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no credentials, private prompts, or sensitive world data.
          required: true
        - label: This is not a privately reportable security vulnerability.
          required: true
